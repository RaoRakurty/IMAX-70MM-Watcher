name: IMAX 70MM seat watcher

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send an ntfy test notification only"
        required: false
        type: boolean
        default: false
      scheduler_source:
        description: "Reserved for the authenticated external scheduler"
        required: false
        type: string
        default: "manual"
      scheduled_slot:
        description: "Reserved UTC scheduler slot"
        required: false
        type: string
        default: ""
      dispatch_signature:
        description: "Reserved HMAC proof"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: imax-seat-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: https://ntfy.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate ten-minute scheduler slot
        id: scheduler
        if: ${{ inputs.scheduler_source == 'cloudflare-cron' }}
        env:
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          DISPATCH_SIGNATURE: ${{ inputs.dispatch_signature }}
          DISPATCH_HMAC_SECRET: ${{ secrets.DISPATCH_HMAC_SECRET }}
        run: |
          python dispatch_guard.py \
            --slot "$SCHEDULED_SLOT" \
            --signature "$DISPATCH_SIGNATURE"
          echo "slot=$SCHEDULED_SLOT" >> "$GITHUB_OUTPUT"

      - name: Reject unrecognized scheduler source
        if: ${{ inputs.scheduler_source != 'manual' && inputs.scheduler_source != 'cloudflare-cron' }}
        run: |
          echo "Unrecognized scheduler source" >&2
          exit 1

      - name: Mark automatic check started
        if: ${{ inputs.scheduler_source == 'cloudflare-cron' }}
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: python healthcheck_ping.py start --url "$HC_PING_URL"

      - name: Send ntfy test notification
        if: ${{ inputs.scheduler_source == 'manual' && inputs.test_notification == true }}
        run: python watcher.py --test-notify

      - name: Run watcher
        id: scan
        if: ${{ inputs.test_notification != true }}
        shell: bash
        run: |
          run_started_at=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")
          set +e
          python watcher.py
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          scan_status=$(python - "$run_started_at" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("state.json")
          if not path.exists():
              print("")
          else:
              state = json.loads(path.read_text())
              last_scan = state.get("last_scan", {})
              try:
                  run_started = datetime.fromisoformat(sys.argv[1])
                  scan_started = datetime.fromisoformat(last_scan.get("started_at", ""))
                  if scan_started.tzinfo is None:
                      scan_started = scan_started.replace(tzinfo=timezone.utc)
                  fresh = scan_started >= run_started.astimezone(timezone.utc)
              except (ValueError, TypeError):
                  fresh = False
              print(last_scan.get("status", "") if fresh else "")
          PY
          )

          if [ "$scan_status" = "backoff" ]; then
            echo "Cinemark backoff is active; treating this as an expected completed run."
            exit 0
          fi

          exit "$rc"

      - name: Persist watcher state
        id: persist
        # Persist backoff, successful scans, and unsent notification outbox entries.
        # Genuine watcher failures remain failures; expected Cinemark backoff is healthy.
        if: ${{ always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes"
            exit 0
          fi

          git config user.name "imax-seat-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update IMAX watcher state [skip ci]"

          for attempt in 1 2 3; do
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "Concurrent state conflict; refusing to overwrite remote state" >&2
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Could not persist state after 3 attempts" >&2
          exit 1

      - name: Mark automatic check healthy
        if: ${{ inputs.scheduler_source == 'cloudflare-cron' && steps.scan.outcome == 'success' && steps.persist.outcome == 'success' }}
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: python healthcheck_ping.py success --url "$HC_PING_URL"

      - name: Record automatic cadence evidence
        if: ${{ always() && inputs.scheduler_source == 'cloudflare-cron' }}
        env:
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          watcher_status=$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("state.json")
          if not path.exists():
              print("unknown")
          else:
              state = json.loads(path.read_text())
              print(state.get("last_scan", {}).get("status", "unknown"))
          PY
          )
          {
            echo "## Signed automatic run"
            echo
            echo "- Scheduled slot: $SCHEDULED_SLOT"
            echo "- Workflow scan step: $SCAN_OUTCOME"
            echo "- Watcher status: $watcher_status"
            echo "- State persistence: $PERSIST_OUTCOME"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
